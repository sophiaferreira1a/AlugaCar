spring.application.name=alugacar

# Banco de dados (Supabase / PostgreSQL) - valores vêm de variáveis de ambiente
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# JWT: JWT_SECRET deve ser uma chave Base64 com pelo menos 32 bytes
# (gere com: openssl rand -base64 32). JWT_EXPIRATION em milissegundos.
# Atenção: o prefixo "app." é o que o JwtService e o SecurityConfig leem.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS: origens permitidas, separadas por vírgula
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
